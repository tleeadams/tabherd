[package]
name = "tabherd"
version = "0.4.0"
description = "Tabherd: a dashboard for your coding agents, in a window of its own"
license = "GPL-3.0-or-later"
repository = "https://github.com/tleeadams/tabherd"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
