<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabherd</title>
  <!-- What the window shows while the app starts the dashboard server, or if
       the server can't start. The app calls showError() with the reason. -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f4ef, #191816);
      --text: light-dark(#1f1e1b, #ecebe6);
      --muted: light-dark(#6b6760, #a7a39a);
      --accent: light-dark(#0a6cdc, #4a9dff);
      --danger: light-dark(#c0392b, #ff7b6b);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 460px; padding: 24px; text-align: center; }
    .spinner {
      width: 22px;
      height: 22px;
      margin: 0 auto 12px;
      border: 2.5px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    p { margin: 8px 0 0; color: var(--muted); overflow-wrap: anywhere; }
    .failed .spinner { display: none; }
    .failed h1 { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1 id="title">Starting Tabherd…</h1>
    <p id="detail"></p>
  </main>
  <script>
    function showError(message) {
      document.body.classList.add('failed');
      document.getElementById('title').textContent = "Tabherd couldn't start";
      document.getElementById('detail').textContent = message;
    }
  </script>
</body>
</html>
