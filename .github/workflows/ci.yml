name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Run it by hand from the Actions tab, or with `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The dashboard runs anywhere Node does, so the tests run on each OS, with
    # the oldest Node the app supports and the one releases bundle.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    # The tests take under a minute. A runner that stops answering otherwise
    # holds the check open for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  build:
    # Builds the Windows installer and zip as a tagged release would, so a
    # broken build shows up before release day. They're kept for a week to try
    # out.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          retention-days: 7

  app:
    # Lints the desktop app and compiles it on each system, so a change that
    # breaks it on one shows up before that system's release does.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - name: Install WebKitGTK and the libraries Tauri needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf libfuse2
      - run: node ../../scripts/stage-app.js
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # On macOS and Linux, the app to try, kept for a week, built as a
      # release's is, by the release script: signed ad hoc on macOS. The
      # build job makes Windows' installer.
      - name: Build the app to try
        if: runner.os != 'Windows'
        run: node ../../scripts/build-release.js --target ${{ runner.os == 'Linux' && 'linux-x64' || 'macos-arm64' }} --app
      # As the release checks it, so a change that breaks it shows up here.
      - name: Check the ad hoc signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 target/aarch64-apple-darwin/release/bundle/macos/Tabherd.app
      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          retention-days: 7

  build-unix:
    # Builds this system's macOS or Linux release, unpacks it and tries it:
    # the launcher starts the dashboard, and --install and --uninstall work.
    # On macOS, the installed Tabherd.app is opened too.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/build-release.js --download-node
      - name: Try the release
        env:
          PORT: '4421'
        run: |
          mkdir try && tar -xzf dist/tabherd-v*.tar.gz -C try
          cd try/tabherd-*
          export TABHERD_DATA_DIR="$(mktemp -d)"
          ./tabherd
          for i in $(seq 1 20); do curl -sf "http://127.0.0.1:$PORT/" | grep -q '<title>Tabherd</title>' && break; sleep 1; done
          curl -sf "http://127.0.0.1:$PORT/" | grep -q '<title>Tabherd</title>' || { echo "::error::The dashboard didn't start."; exit 1; }
          ./tabherd --install
          if [ "$RUNNER_OS" = macOS ]; then open "$HOME/Applications/Tabherd.app"; fi
          ./tabherd --uninstall
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: dist/*.tar.gz
          retention-days: 7

  all-passed:
    # The one check the rulesets require, so adding a job or an OS above
    # doesn't mean changing them. A job skipped because another failed would
    # count as passing, so this runs regardless and checks each result.
    name: All checks passed
    if: always()
    needs: [test, build, build-unix, app]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
