name: Release

# Pushing a version tag, such as v0.1.0, on main builds the releases (an
# installer and a zip for Windows, archives for macOS and Linux) and creates a
# draft GitHub release with them. Check the draft, then publish it.
# A tag with a hyphen (v0.2.0-beta.1) makes a prerelease.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # The Windows release: the desktop app in app/src-tauri, as an installer
    # and a zip, built on Windows with Rust and Tauri.
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # For SignPath to fetch the unsigned app and installer from this run.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # All history, to check the tag is on main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - name: Check the tag is on main and matches package.json
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Releases are tagged on main, after the release branch is merged."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version $version in package.json."
            exit 1
          fi
      - run: npm test
      - run: node scripts/build-release.js --stage
      # The app is signed through SignPath Foundation once the
      # SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret are
      # set (see CONTRIBUTING.md); until then it ships unsigned. Only the app
      # is sent: the bundled node.exe has the Node.js project's own signature.
      # Each request waits for an approver on signpath.io.
      - name: Upload the app for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-${{ matrix.os }}
          path: dist/*/Tabherd.exe
          if-no-files-found: error
      - name: Sign the app
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tabherd' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # Time for an approver to approve the request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed
      - name: Check the signature and put the signed app in the release
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-Item 'dist/signed/Tabherd.exe'
          $signature = Get-AuthenticodeSignature $signed.FullName
          if ($signature.Status -ne 'Valid') { throw "The signed app's signature is $($signature.Status): $($signature.StatusMessage)" }
          "Signed by $($signature.SignerCertificate.Subject)"
          Copy-Item $signed.FullName (Get-Item 'dist/tabherd-*/Tabherd.exe').FullName -Force
          Remove-Item dist/signed -Recurse
      # The zip, and the installer around the app as it now is.
      - run: node scripts/build-release.js --pack
      # Then the installer is signed too: a second request, under the
      # project's artifact configuration for it.
      - name: Upload the installer for signing
        id: unsigned-installer
        if: steps.unsigned.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ matrix.os }}
          path: dist/*-setup.exe
          if-no-files-found: error
      - name: Sign the installer
        if: steps.unsigned-installer.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tabherd' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed
      - name: Check the installer's signature and put it in the release
        if: steps.unsigned-installer.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-Item 'dist/signed/*-setup.exe'
          $signature = Get-AuthenticodeSignature $signed.FullName
          if ($signature.Status -ne 'Valid') { throw "The signed installer's signature is $($signature.Status): $($signature.StatusMessage)" }
          "Signed by $($signature.SignerCertificate.Subject)"
          Copy-Item $signed.FullName (Get-Item 'dist/tabherd-*-setup.exe').FullName -Force
          Remove-Item dist/signed -Recurse
          node scripts/build-release.js --checksums
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/RELEASE_NOTES.md

  build-unix:
    # The macOS and Linux releases. Their launcher is a shell script and Node
    # is downloaded for each, checked against Node's published checksums, so
    # one Linux runner builds them all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build the macOS and Linux releases
        run: |
          for target in macos-arm64 macos-x64 linux-x64 linux-arm64; do
            node scripts/build-release.js --target "$target" --download-node
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-unix
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  build-macos:
    # The macOS desktop app, signed and notarized, once the APPLE_SIGNING
    # variable is "on" and the Apple secrets are in the release environment
    # (see CONTRIBUTING.md). Until then this is skipped, and macOS ships the
    # archives build-unix makes. One Apple silicon runner builds both, the
    # Intel one for its target.
    if: vars.APPLE_SIGNING == 'on'
    environment: release
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.arch }}
      # Tauri imports the certificate into a keychain of its own, signs the
      # app and its Node under the hardened runtime, has Apple notarize the
      # app with the API key, and staples the ticket.
      - name: Build, sign and notarize the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::APPLE_SIGNING is on, but the secret $name isn't in the release environment."; exit 1; fi
          done
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          node scripts/build-release.js --target "macos-${{ matrix.arch }}" --app
          rm -f "$APPLE_API_KEY_PATH"
      # Fails rather than release an app that macOS would refuse.
      - name: Check the signature and the notarization
        run: |
          triple=${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          app=$(ls -d app/src-tauri/target/$triple/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)='
          codesign --verify --strict "$app/Contents/MacOS/node"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

  release:
    # Waits for every build, and goes ahead without the macOS app when its
    # build is switched off.
    needs: [build, build-unix, build-macos]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-unix.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-macos.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # SignPath Foundation asks every download page to say what the
          # program does and to link the code signing policy.
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            printf '**Tabherd** is a dashboard for your Claude Code and Codex sessions: which ones need you, which are working, and what they last said. The [README](%s#readme) says what it shows and how to install it.\n\n' "$repo"
            cat dist/RELEASE_NOTES.md
            printf '\n[Code signing policy](%s#code-signing-policy)\n' "$repo"
          } > dist/notes.md
          mv dist/notes.md dist/RELEASE_NOTES.md
          # The macOS app's disk images are there only when it was built.
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.dmg dist/*.zip dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "Tabherd $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
